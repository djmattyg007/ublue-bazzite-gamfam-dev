[tool_alias]
mq = "github:harehare/mq"

[tools]
choose = "1.3.7"
doggo = "1.4.2"
powershell = "7.7.0"
rclone = "1.76.0"
regctl = "0.11.7"
regsync = "0.11.7"
restic = "0.20.0"
shfmt = "3.14.1"
tealdeer = "1.9.1"
usage = "7.4.1"

[tools."github:marcusbuffett/pipe-rename"]
version = "1.6.7"
bin = "renamer"

[tools.mq]
version = "0.10.0"
matching = "mq"
rename_exe = "mq"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64"]
os = "linux"
